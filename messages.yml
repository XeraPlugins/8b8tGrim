        {2}'
    titles:
      enabled: false
      titleContent: '{PREFIX}'
      subtitleContent: '&8Restarting in &c{0}&8! &7&o(&r{2}&7&o)'
         
  COMMAND_FORCE_RESTART_INVALID:
   # Placeholders: {0} = input
   # Scope: User
    chatMessage:
      enabled: true
      centered: false
      content:
      - ''
      - ' {PREFIX} &8Could not force restart because your interval argument is faulty!'
      - ''
      - '  &cDetails:'
      - '  &7• &cYour argument: &8{0}'
      - '  &7• &cExpected argument: &8Positive Integer (e.g 60)'
      - ''
    actionbar:
      enabled: false
