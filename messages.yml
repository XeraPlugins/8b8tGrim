#########################################################################################
#                                                                                       #
# NOTE: PLEASE READ BEFORE CONFIGURING!                                                 #
#                                                                                       #
# If PlaceholderAPI is installed you can use any placeholder inside messages,           #
# make sure to properly install any extension using /papi ecloud.                       #
#                                                                                       #
# Placeholders that are inside {} (e.g {0}, {1}) are inner placeholders.                #
# To use PAPI's placeholders, use them normally, like %player_gamemode%, etc.           #
#                                                                                       #
# Scopes:                                                                               #
# 1) Global -> All online players will get the message.                                 #
# 2) User -> User that executed commands/triggered event will get the message.          #
# 3) Limited -> Only users/systems with specific perms will get the message.            #
#                                                                                       #
# Note: Scopes are per message and cannot be manually altered.                          #
#                                                                                       #
#########################################################################################     

# Note: Whether or not to strip colors from messages shown to console (to display issues with some panels).
stripConsole: false

# Note: Default reason placeholder if a custom reason was not defined (force restart command)
defaultReason: Scheduled restart
messages:

   # Note: Use {PREFIX} &f» in any message to add the below prefix!
  prefix: '&8[&98b&78t&8] &7>>'
  EVENT_INTERVAL_GLOBAL:
   # Placeholders: {0} = interval, {1} = reason (if defined through the force command, otherwise it'll show N/A)
   # Scope: Global
    chatMessage:
      enabled: true
      centered: false
      content:
      - ''
      - '{PREFIX} &8Restarting in &c{0}&8!'
      - ''
    actionbar:
      enabled: true
      content: '{PREFIX} &8Restarting in &c{0}&8!'
    titles:
      enabled: false
      titleContent: '{PREFIX}'
      subtitleContent: '&8Restarting in &c{0}&8!'
         
  EVENT_INTERVAL_CONSOLE:
   # Placeholders: {0} = interval, {1} = reason (if defined through the force command, otherwise it'll show N/A)
   # Scope: Limited -> Console only
    chatMessage:
      enabled: true
      centered: false
      content:
      - '{PREFIX} &8Restarting in &c{0}&8!'
         
  EVENT_RESTART_GLOBAL:
   # Placeholders: None
   # Scope: Global
    chatMessage:
      enabled: false
      centered: false
      content:
      - ''
      - '{PREFIX} &8Restarting... join back soon!'
      - ''
    actionbar:
      enabled: true
      content: '{PREFIX} &8Restarting... join back soon!'
    titles:
      enabled: false
      titleContent: '{PREFIX}'
      subtitleContent: '&8Restarting... join back soon!'
         
  EVENT_RESTART_DELAY_GLOBAL:
   # Placeholders: {0} = interval
   # Scope: Global
    chatMessage:
      enabled: false
      centered: false
      content:
      - ''
      - '{PREFIX} &8The restart has been delayed by &c{0}&8!'
      - ''
    actionbar:
      enabled: true
      content: '{PREFIX} &8The restart has been delayed by &c{0}&8!'
    titles:
      enabled: false
      titleContent: '{PREFIX}'
      subtitleContent: '&8Restart has been delayed by &c{0}&8!'
         
  EVENT_RESTART_DELAY_STAFF:
   # Placeholders: {0} = interval
   # Scope: Limited -> uar.notifydelay
    chatMessage:
      enabled: false
      centered: false
      content:
      - ''
      - '{PREFIX} &8The restart has been delayed by &c{0}&8!'
      - ''
    actionbar:
      enabled: true
      content: '&c(Staff) {PREFIX} &8The restart has been delayed by &c{0}&8!'
    titles:
      enabled: false
      titleContent: '{PREFIX}'
      subtitleContent: '&8Restart has been delayed by &c{0}&8!'

   ############################### 
      
  COMMAND_USER_VIEWINTERVAL:
   # Placeholders: {0} = interval, {1} = time since last restart, {2} = reason (if defined through the force command, otherwise it'll show N/A)
   # Scope: User
    chatMessage:
      enabled: true
      centered: true
      content:
      - ''
      - '{PREFIX} &8Restarting in &c{0}&8!'
      - '&7&o(Last restart happened {1} ago)'
      - ''
    actionbar:
      enabled: false
      content: '{PREFIX} &8Restarting in &c{0}&8!'
    titles:
      enabled: false
      titleContent: '{PREFIX}'
      subtitleContent: '&8Restarting in &c{0}&8!'
         
   ###############################  
      
